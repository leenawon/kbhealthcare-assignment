name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: 타입 체크 / 린트 / 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 체크
        run: pnpm tsc --noEmit

      - name: 린트
        run: pnpm lint

      - name: 빌드
        run: pnpm build
